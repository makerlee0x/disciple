name: carry-follower-route

# Carry research: Disciple pool following MSTR/USDG vs the live Uniswap pools (read-only fork report).
on:
  push:
    branches: [claude/project-thread-wtipoo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Pinned deps (DEPENDENCIES.md)
        run: |
          dep() { git clone -q --recursive "https://github.com/$1.git" "lib/$2" && git -C "lib/$2" checkout -q "$3" && git -C "lib/$2" submodule -q update --init --recursive; }
          dep foundry-rs/forge-std forge-std f3dae6e6ee381f25eb6a246f7da9b85c91a68219
          dep OpenZeppelin/openzeppelin-contracts openzeppelin-contracts cab19933c33c2ad1d4c7a84864a3601dddfd16f3
          dep uniswap/v4-core v4-core e50237c43811bd9b526eff40f26772152a42daba
          dep uniswap/v4-periphery v4-periphery 9969eec44cfdf07e24b41de47f40276a58401976
      - name: Route report
        env:
          FORK_RPC_RH: https://rpc.mainnet.chain.robinhood.com
        run: forge test --match-path test/hook/CarryFollowerRouteFork.t.sol -vv
