<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="The sniper tax falls each second: 99%, 25%, 3%, 1%, 0.3%, 0.1%, 0.03%, then 0% from 7 seconds">
<title>The sniper tax falls each second: 99%, 25%, 3%, 1%, 0.3%, 0.1%, 0.03%, then 0% from 7 seconds</title>
<rect x="0.5" y="0.5" width="719" height="279" rx="12" fill="#121318" stroke="rgba(201,206,214,.14)"/>
<g font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<text x="64" y="26" font-size="11" letter-spacing="1.4" fill="#BCC0CA">SNIPER TAX ON BOOSTS, BY SECOND AFTER LAUNCH</text>
<line x1="64" x2="680" y1="222.0" y2="222.0" stroke="rgba(201,206,214,.10)"/>
<text x="54" y="226.0" text-anchor="end" font-size="12" fill="#9095A0">0%</text>
<line x1="64" x2="680" y1="133.0" y2="133.0" stroke="rgba(201,206,214,.10)"/>
<text x="54" y="137.0" text-anchor="end" font-size="12" fill="#9095A0">50%</text>
<line x1="64" x2="680" y1="44.0" y2="44.0" stroke="rgba(201,206,214,.10)"/>
<text x="54" y="48.0" text-anchor="end" font-size="12" fill="#9095A0">100%</text>
<rect x="70.0" y="45.8" width="65.0" height="176.2" rx="2" fill="rgba(232,234,238,.8)"/>
<text x="102.5" y="37.8" text-anchor="middle" font-size="12" fill="#E8EAEE">99%</text>
<text x="102.5" y="244" text-anchor="middle" font-size="12" fill="#9095A0">0s</text>
<rect x="147.0" y="177.5" width="65.0" height="44.5" rx="2" fill="rgba(232,234,238,.45)"/>
<text x="179.5" y="169.5" text-anchor="middle" font-size="12" fill="#E8EAEE">25%</text>
<text x="179.5" y="244" text-anchor="middle" font-size="12" fill="#9095A0">1s</text>
<rect x="224.0" y="216.7" width="65.0" height="5.3" rx="2" fill="rgba(232,234,238,.45)"/>
<text x="256.5" y="208.7" text-anchor="middle" font-size="12" fill="#E8EAEE">3%</text>
<text x="256.5" y="244" text-anchor="middle" font-size="12" fill="#9095A0">2s</text>
<rect x="301.0" y="220.2" width="65.0" height="1.8" rx="2" fill="rgba(232,234,238,.45)"/>
<text x="333.5" y="212.2" text-anchor="middle" font-size="12" fill="#E8EAEE">1%</text>
<text x="333.5" y="244" text-anchor="middle" font-size="12" fill="#9095A0">3s</text>
<rect x="378.0" y="220.5" width="65.0" height="1.5" rx="2" fill="rgba(232,234,238,.45)"/>
<text x="410.5" y="212.5" text-anchor="middle" font-size="12" fill="#E8EAEE">0.3%</text>
<text x="410.5" y="244" text-anchor="middle" font-size="12" fill="#9095A0">4s</text>
<rect x="455.0" y="220.5" width="65.0" height="1.5" rx="2" fill="rgba(232,234,238,.45)"/>
<text x="487.5" y="212.5" text-anchor="middle" font-size="12" fill="#E8EAEE">0.1%</text>
<text x="487.5" y="244" text-anchor="middle" font-size="12" fill="#9095A0">5s</text>
<rect x="532.0" y="220.5" width="65.0" height="1.5" rx="2" fill="rgba(232,234,238,.45)"/>
<text x="564.5" y="212.5" text-anchor="middle" font-size="12" fill="#E8EAEE">0.03%</text>
<text x="564.5" y="244" text-anchor="middle" font-size="12" fill="#9095A0">6s</text>
<rect x="609.0" y="220.5" width="65.0" height="1.5" rx="2" fill="rgba(232,234,238,.45)"/>
<text x="641.5" y="212.5" text-anchor="middle" font-size="12" fill="#E8EAEE">0%</text>
<text x="641.5" y="244" text-anchor="middle" font-size="12" fill="#9095A0">7s+</text>
<text x="372.0" y="268" text-anchor="middle" font-size="12" fill="#9095A0">Seconds after launch. From 7 seconds on, only the normal 1% fee is left.</text>
</g>
</svg>
