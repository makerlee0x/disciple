[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# HookMiner salt search (5 hook flags incl. BEFORE_INITIALIZE) can exceed the default 1B test gas limit
gas_limit = "18446744073709551615"
ffi = false
fs_permissions = [{ access = "read", path = "./test/fixtures/mav2-rht.json" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "solmate/=lib/v4-core/lib/solmate/",
    "v4-core/=lib/v4-core/",
    "v4-periphery/=lib/v4-periphery/",
]

# Fast local builds/tests with the Solar compiler: `FOUNDRY_PROFILE=solar forge test --isolate`.
# Dev loop ONLY. Solar codegen is experimental; never deploy, snapshot gas or check EIP-170 sizes with this
# profile. Separate out/cache so it never mixes with solc artifacts. See README "Fast builds with Solar".
[profile.solar]
solc = "script/solar-solc.sh"
out = "out-solar"
cache_path = "cache-solar"
# 2264 = Solar's "code generation is experimental" warning, expected under this profile
ignored_error_codes = [2264]

# Robinhood Chain (EVM) — placeholders until RH chain IDs / RPCs are published
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
localhost = "http://127.0.0.1:8545"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
